# Docker uchun (docker-compose.prod.yml -> nginx xizmati). deploy/nginx/mezon.conf bilan bir xil,
# farqi: ilova 'app' konteynerida, sertifikatlar /etc/mezon/tls (TLS_DIR dan) ulanadi:
#   server.fullchain.crt, server.key
# Brute-force himoyasi: kirish va E-IMZO tekshiruvi (ilovadagi cheklovdan oldingi qatlam)
limit_req_zone $binary_remote_addr zone=mezon_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mezon_api:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=mezon_conn:10m;

upstream mezon_app {
    server app:3001;
    keepalive 32;
}

# HTTP -> HTTPS (oddiy HTTP da hech narsa berilmaydi)
server {
    listen 80;
    listen [::]:80;
    server_name _;
    location = /healthz { return 200 'ok'; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/mezon/tls/server.fullchain.crt;
    ssl_certificate_key /etc/mezon/tls/server.key;

    # Faqat TLS 1.3: zaif shifrlar va eski protokollar yo'q, forward secrecy majburiy
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MEZON_TLS:20m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # Eski Windows 7 / IE kerak bo'lsa (tavsiya etilmaydi):
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256;

    # HSTS, CSP va boshqa xavfsizlik sarlavhalarini ilovaning o'zi qo'yadi (lib/securityHeaders.ts)
    server_tokens off;

    # Ilovadagi eng katta yuklash: 25 MB (+ multipart)
    client_max_body_size 27m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn mezon_conn 50;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Ilova TRUSTED_PROXY_HOPS=1 bilan aynan shu qo'shgan IP ni ishlatadi
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    # Ichki identifikatsiya sarlavhalari mijozdan qabul qilinmaydi (ilova ham tozalaydi)
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
    proxy_set_header X-Access-Approved "";
    proxy_set_header X-Session-Id "";
    # Viloyat-server sarlavhalari faqat mTLS blokida (mezon-mtls.conf) ishonchli
    proxy_set_header X-Mezon-Site-Cert "";
    proxy_set_header X-Mezon-Site-Verify "";
    proxy_read_timeout 60s;

    # Next.js statik fayllari: o'zgarmaydi (nomida xesh bor) — uzoq kesh
    location /_next/static/ {
        proxy_pass http://mezon_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/api/(auth/(login|admin|eimzo/verify|register)|superadmin/(login|register))$ {
        limit_req zone=mezon_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://mezon_app;
    }

    location /api/ {
        limit_req zone=mezon_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://mezon_app;
    }

    location / {
        proxy_pass http://mezon_app;
    }
}
