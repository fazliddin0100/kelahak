# Mezon — viloyat serverlari va markaz o'rtasidagi aloqa (mTLS, 8443-port).
# Ikki tomon ham sertifikat ko'rsatadi: server — serverAuth, viloyat — clientAuth
# (CLIENT=1 bash scripts/pki/issue-server.sh <viloyat>-sync <host>).
# Sertifikati bo'lmagan yoki boshqa CA bergan ulanish TLS darajasidayoq uziladi.
#
# Viloyat tomonda (masalan, curl yoki Node): --cert viloyat-sync.crt --key viloyat-sync.key --cacert ca.crt

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name mezon-sync.example.lan;

    ssl_certificate     /etc/mezon/tls/server.fullchain.crt;
    ssl_certificate_key /etc/mezon/tls/server.key;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_tickets off;

    # Mijoz sertifikati majburiy va faqat ichki CA dan
    ssl_client_certificate /etc/mezon/tls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    # Bekor qilingan viloyat sertifikatlari (CRL): openssl ca -gencrl bilan yangilanadi
    # ssl_crl /etc/mezon/tls/ca.crl;

    # Faqat ruxsat etilgan viloyat serverlari (sertifikat CN bo'yicha)
    # map $ssl_client_s_dn_cn $mezon_site_ok { default 0; "samarqand.lan" 1; "buxoro.lan" 1; }
    # if ($mezon_site_ok = 0) { return 403; }

    server_tokens off;
    client_max_body_size 27m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Ilova qaysi viloyat serveri ulanganini bilishi uchun (faqat shu blokda ishonchli)
        proxy_set_header X-Mezon-Site-Cert $ssl_client_s_dn_cn;
        proxy_set_header X-Mezon-Site-Verify $ssl_client_verify;
    }
}
