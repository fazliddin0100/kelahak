# Production deploy — barcha xizmatlar bir tarmoqda
# Ishlatish: docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: mysayt-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mysayt-prod

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: mysayt-pgbouncer-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      # Postgres 16 SCRAM ishlatadi; md5 bilan PgBouncer serverga ulana olmaydi
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 50
    networks:
      - mysayt-prod

  redis:
    image: redis:7-alpine
    container_name: mysayt-redis-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mysayt-prod

  backup-init:
    image: mezon/backup:offline
    build:
      context: .
      dockerfile: Dockerfile
      target: backup
    container_name: mysayt-backup-init-prod
    # Bir martalik zaxira (migratsiyadan oldin) — tugaydi; kunlik jadval 'backup' xizmatida
    command: ['/usr/local/bin/backup-once.sh']
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RESTIC_REPOSITORY: /backup/restic
      RESTIC_PASSWORD_FILE: /run/secrets/backup_repository_password
      TZ: Asia/Tashkent
    secrets:
      - backup_repository_password
    volumes:
      - uploads_data:/data/uploads:ro
      - staging_data:/var/lib/mexon/staging:ro
      - ${BACKUP_PATH:?Set BACKUP_PATH to the mounted external backup drive}:/backup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mysayt-prod
    restart: 'no'

  migrate:
    image: mezon/migrator:offline
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: mysayt-migrate-prod
    working_dir: /app
    env_file: .env.production.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
    secrets:
      - app_encryption_key
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      backup-init:
        condition: service_completed_successfully
    networks:
      - mysayt-prod
    restart: 'no'

  app:
    image: mezon/app:offline
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysayt-app-prod
    restart: always
    env_file: .env.production.local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?pgbouncer=true&schema=public
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      # E-IMZO: ishonchli CA (faqat ochiq sertifikat; CA kaliti oflayn)
      EIMZO_CA_CERT_FILE: /run/secrets/eimzo_ca_cert
      # Nginx (pastdagi konteyner) X-Forwarded-For ga mijoz IP sini qo‘shadi.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    secrets:
      - app_encryption_key
      - eimzo_ca_cert
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Faqat lokal interfeys: tashqi kirish Nginx (TLS) orqali bo‘lishi shart.
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3001}:3001'
    volumes:
      - staging_data:/var/lib/mexon/staging
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/superadmin/setup-status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mysayt-prod

  # HTTPS (TLS 1.3) — foydalanuvchilar shu orqali kiradi. Sertifikat: ichki CA (deploy/README.md)
  nginx:
    image: nginx:1.27-alpine
    container_name: mysayt-nginx-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443'
      - '${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./secrets/pki-servers/server}:/etc/mezon/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', '--no-check-certificate', 'https://127.0.0.1/api/superadmin/setup-status']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mysayt-prod

  backup:
    image: mezon/backup:offline
    build:
      context: .
      dockerfile: Dockerfile
      target: backup
    container_name: mysayt-backup-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RESTIC_REPOSITORY: /backup/restic
      RESTIC_PASSWORD_FILE: /run/secrets/backup_repository_password
      TZ: Asia/Tashkent
    secrets:
      - backup_repository_password
    volumes:
      - uploads_data:/data/uploads:ro
      - staging_data:/var/lib/mexon/staging:ro
      - ${BACKUP_PATH:?Set BACKUP_PATH to the mounted external backup drive}:/backup
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - mysayt-prod

volumes:
  postgres_prod_data:
  redis_prod_data:
  uploads_data:
  staging_data:

secrets:
  app_encryption_key:
    file: ./secrets/app-encryption-key
  backup_repository_password:
    file: ./secrets/backup-repository-password
  eimzo_ca_cert:
    file: ./secrets/pki/ca.crt

networks:
  mysayt-prod:
    driver: bridge
