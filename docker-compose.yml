services:
  postgres:
    image: postgres:16-alpine
    container_name: mysayt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mysayt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysayt_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mysayt}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mysayt} -d ${POSTGRES_DB:-mysayt}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mysayt-net

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: mysayt-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mysayt}:${POSTGRES_PASSWORD:-mysayt_secret}@postgres:5432/${POSTGRES_DB:-mysayt}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    networks:
      - mysayt-net

  redis:
    image: redis:7-alpine
    container_name: mysayt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mysayt-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysayt-app
    restart: unless-stopped
    profiles:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mysayt}:${POSTGRES_PASSWORD:-mysayt_secret}@pgbouncer:5432/${POSTGRES_DB:-mysayt}?pgbouncer=true
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH:?JWT_SECRET_REFRESH is required in .env}
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
    secrets:
      - app_encryption_key
    ports:
      - "${APP_PORT:-3001}:3001"
    networks:
      - mysayt-net

volumes:
  postgres_data:
  redis_data:

networks:
  mysayt-net:
    driver: bridge

secrets:
  app_encryption_key:
    file: ./secrets/app-encryption-key
